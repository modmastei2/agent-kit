<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas</title>
<!-- Built by atlas scripts/build.mjs: edit the dataset and rebuild, not this page. -->
<style>
:root {
  --bg: #0e1116; --panel: #161b22; --panel2: #1c232d; --line: #2a3340; --text: #d8dee6; --dim: #8a96a5;
  --accent: #8fd0ff; --port: #f2c94c; --node: #3a4452;
}
:root[data-theme="light"] { --bg: #f4f6f9; --panel: #ffffff; --panel2: #eef1f5; --line: #d6dce4; --text: #1d232b; --dim: #5f6b7a; --accent: #0b6bcb; --node: #b8c2cf; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #f4f6f9; --panel: #ffffff; --panel2: #eef1f5; --line: #d6dce4; --text: #1d232b; --dim: #5f6b7a; --accent: #0b6bcb; --node: #b8c2cf; } }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 system-ui, "Segoe UI", Tahoma, sans-serif; overflow: hidden; }
button, input { font: inherit; color: inherit; }
#app { display: grid; grid-template-columns: 290px 1fr 370px; height: 100%; }
aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
#detail { border-right: 0; border-left: 1px solid var(--line); }
header { padding: 12px 14px 8px; border-bottom: 1px solid var(--line); }
h1 { font-size: 15px; margin: 0 0 8px; }
h2 { font-size: 14px; margin: 0 0 4px; }
h3 { font-size: 12px; margin: 14px 0 6px; color: var(--dim); text-transform: uppercase; letter-spacing: .6px; }
#q { width: 100%; padding: 7px 9px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; outline: none; }
#q:focus { border-color: var(--accent); }
.toggles { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.toggles label { display: flex; align-items: center; gap: 4px; padding: 2px 7px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; user-select: none; font-size: 12px; }
.toggles input { margin: 0; }
.sw { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.scroll { overflow: auto; flex: 1; padding: 6px 14px 16px; min-height: 0; }
#detail .scroll { padding-top: 12px; }
.row { display: flex; justify-content: space-between; gap: 8px; padding: 3px 6px; border-radius: 4px; cursor: pointer; }
.row:hover { background: var(--panel2); }
.row .r { color: var(--dim); white-space: nowrap; font-size: 12px; }
.tag { font-size: 11px; padding: 0 5px; border-radius: 3px; background: var(--panel2); white-space: nowrap; }
.id { color: var(--dim); font-size: 11px; font-family: Consolas, ui-monospace, monospace; margin-left: 4px; }
.muted { color: var(--dim); }
#view { position: relative; overflow: hidden; cursor: grab; background: radial-gradient(circle at 1px 1px, color-mix(in srgb, var(--dim) 25%, transparent) 1px, transparent 0) 0 0 / 24px 24px, var(--bg); }
#view.drag { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#links { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
#links path { fill: none; stroke-width: 2.5; vector-effect: non-scaling-stroke; }
/* dashes keep their length on screen at any zoom: --k is 1 / zoom */
#links path.oneway { stroke-dasharray: calc(8px * var(--k, 1)) calc(6px * var(--k, 1)); }
#links path.dotted { stroke-dasharray: calc(3px * var(--k, 1)) calc(5px * var(--k, 1)); }
#links path.hit { stroke: transparent !important; stroke-width: 14; stroke-dasharray: none !important; pointer-events: stroke; }
#links.picked path:not(.hit) { opacity: .15; }
#links.picked path.on { opacity: 1; stroke-width: 5; }
#links path.hov { stroke-width: 6 !important; opacity: 1 !important; }
.node { position: absolute; border: 2px solid var(--node); background: var(--panel2); }
.node.plain { border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 8px; font-size: 20px; }
.node.sel { outline: 3px solid var(--accent); outline-offset: 3px; }
.node img { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .8; pointer-events: none; }
.node .title { position: absolute; left: 0; bottom: 100%; margin-bottom: 4px; white-space: nowrap; font-weight: 600; font-size: 22px; cursor: pointer; }
.node.plain .title { position: static; margin: 0; white-space: normal; }
.node svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.mk { position: absolute; width: 12px; height: 12px; transform: translate(-50%, -50%); border: 2px solid #000; cursor: pointer; }
.mk.dot { border-radius: 50%; }
.mk.diamond { transform: translate(-50%, -50%) rotate(45deg); }
.mk.star { width: 22px; height: 22px; clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
.mk.hl { box-shadow: 0 0 0 4px var(--accent); z-index: 5; }
.lbl { position: absolute; transform: translate(-50%, 8px); white-space: nowrap; font-size: 12px; padding: 0 4px; border-radius: 3px; background: rgba(0,0,0,.65); color: #fff; pointer-events: none; }
body.no-labels .lbl, body.no-links #links { display: none; }
#zoom { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 4px; }
#zoom button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
#hover { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font-size: 12px; display: none; max-width: 380px; z-index: 10; box-shadow: 0 4px 14px rgba(0,0,0,.3); }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
td { padding: 2px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.n { text-align: right; white-space: nowrap; color: var(--dim); }
tr.grp td { color: var(--dim); font-style: italic; border-bottom: 0; padding-top: 6px; }
.a { color: var(--accent); cursor: pointer; }
.a:hover { text-decoration: underline; }
.stat { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 12px; }
.stat b { color: var(--dim); font-weight: 400; }
.files span { font-family: Consolas, ui-monospace, monospace; word-break: break-all; }
.legend div { display: flex; align-items: center; gap: 6px; font-size: 12px; margin: 2px 0; }
@media (max-width: 900px) { #app { grid-template-columns: 1fr; grid-template-rows: auto 1fr 40%; } #side .scroll { max-height: 120px; } }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <header>
      <h1 id="title"></h1>
      <input id="q" autocomplete="off">
      <div class="toggles" id="toggles"></div>
    </header>
    <div class="scroll" id="list"></div>
  </aside>
  <main id="view">
    <div id="world"><svg id="links"></svg></div>
    <div id="hover"></div>
    <div id="zoom"><button id="zin">+</button><button id="zout">−</button><button id="fit"></button></div>
  </main>
  <aside id="detail"><div class="scroll" id="info"></div></aside>
</div>
<script>
const ATLAS = /*__ATLAS__*/null;
const D = ATLAS.data, L = ATLAS.layout;
const UI = Object.assign({
  search: 'Search…', fit: 'All', links: 'Links', labels: 'Labels', legend: 'Legend', notFound: 'Nothing found',
  nodes: 'Nodes', entities: 'Entities', files: 'Files', connections: 'Connections', inside: 'Inside',
  appearsIn: 'Appears in', referencedBy: 'Referenced by', points: 'points', noTarget: 'leads nowhere',
  oneWay: 'one way', start: 'Start here', hint: 'Drag to pan, scroll to zoom. Click a node, a marker or a connection for details.',
}, D.ui || {});
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const nodes = Object.fromEntries(D.nodes.map(n => [n.id, n]));
const ents = D.entities;
const code = (id, o) => `<span class="id">${esc(o?.code ?? id)}</span>`;
const kindOf = k => D.kinds[k] || { label: k, color: '#9aa5b4', shape: 'dot' };
const hue = i => `hsl(${(i * 137.508) % 360},75%,58%)`;
const groupOf = id => D.groups.find(g => g.id === id);
document.title = D.title || document.title;
$('#title').textContent = D.title || 'Atlas';
$('#q').placeholder = UI.search; $('#fit').textContent = UI.fit;

// ---------- indexes ----------
const appears = {}, backrefs = {};
for (const n of D.nodes) for (const m of n.markers) if (m.entity) (appears[m.entity] ??= []).push({ node: n.id, n: m.points.length });
const addRefs = (from, sections) => {
  for (const s of sections || []) for (const r of s.rows || []) if (r.ref) (backrefs[r.ref] ??= []).push({ from, section: s.title, value: r.value });
};
for (const [id, e] of Object.entries(ents)) addRefs(id, e.sections);
for (const n of D.nodes) addRefs(n.id, n.sections);

// ---------- geometry ----------
const box = id => L.nodes[id];
function local(n, p) {
  const s = n.space, b = box(n.id);
  const fx = (p[0] - s.x0) / (s.x1 - s.x0), fy = (p[1] - s.y0) / (s.y1 - s.y0);
  return [fx * b.w, (s.flipY ? 1 - fy : fy) * b.h];
}
const portPt = (nid, pid) => {
  const n = nodes[nid], b = box(nid), p = pid != null && n.ports.find(p => String(p.id) === String(pid));
  const [x, y] = p ? local(n, [p.x, p.y]) : [b.w / 2, b.h / 2];
  return [b.x + x, b.y + y];
};

// ---------- draw ----------
const world = $('#world'), links = $('#links');
world.style.width = L.size[0] + 'px'; world.style.height = L.size[1] + 'px';
links.setAttribute('width', L.size[0]); links.setAttribute('height', L.size[1]);
const nodeEl = {}, markEl = {};
const label = (el, x, y, text) => { const l = document.createElement('div'); l.className = 'lbl'; l.style.left = x + 'px'; l.style.top = y + 'px'; l.textContent = text; el.appendChild(l); };
for (const n of D.nodes) {
  const b = box(n.id); if (!b) continue;
  const el = document.createElement('div');
  el.className = 'node' + (n.image ? '' : ' plain');
  Object.assign(el.style, { left: b.x + 'px', top: b.y + 'px', width: b.w + 'px', height: b.h + 'px' });
  const g = groupOf(n.group); if (g?.color) el.style.borderColor = g.color;
  el.innerHTML = (n.image ? `<img src="${esc(n.image)}" loading="lazy" alt="">` : '') +
    `<div class="title" data-node="${esc(n.id)}">${esc(n.name || n.id)}${code(n.id, n)}</div>`;
  let dots = '';
  for (const m of n.markers) {
    const k = kindOf(m.kind), e = ents[m.entity];
    const text = m.label ?? (e ? e.name + (e.badge ? ' ' + e.badge : '') : '');
    if (k.spread) {
      for (const p of m.points) { const [x, y] = local(n, p); dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="${k.color}" data-entity="${esc(m.entity || '')}" data-kind="${esc(m.kind)}"/>`; }
      const c = m.points.reduce((a, p) => [a[0] + p[0] / m.points.length, a[1] + p[1] / m.points.length], [0, 0]);
      const [x, y] = local(n, c); label(el, x, y, text); el.lastChild.dataset.kind = m.kind;
      continue;
    }
    for (const p of m.points) {
      const [x, y] = local(n, p);
      const mk = document.createElement('div');
      mk.className = 'mk ' + (k.shape || 'dot'); mk.style.left = x + 'px'; mk.style.top = y + 'px'; mk.style.background = k.color;
      if (m.entity) mk.dataset.entity = m.entity; mk.dataset.kind = m.kind; mk.dataset.node = n.id;
      el.appendChild(mk); (markEl[m.entity] ??= []).push(mk);
      if (text) { label(el, x, y, text); el.lastChild.dataset.kind = m.kind; }
    }
  }
  for (const p of n.ports) {
    if (p.hidden) continue;
    const [x, y] = local(n, [p.x, p.y]);
    const mk = document.createElement('div');
    mk.className = 'mk diamond port'; mk.style.left = x + 'px'; mk.style.top = y + 'px'; mk.style.background = 'var(--port)';
    mk.dataset.node = n.id; mk.dataset.port = p.id; mk.dataset.kind = '__port';
    el.appendChild(mk);
    const to = portTarget(n.id, p.id);
    label(el, x, y, to ? '→ ' + (nodes[to.node]?.name || to.node) : (p.name ?? p.id)); el.lastChild.dataset.kind = '__port';
  }
  el.insertAdjacentHTML('beforeend', dots ? `<svg>${dots}</svg>` : '');
  world.appendChild(el); nodeEl[n.id] = el;
}
function portTarget(nid, pid) {
  for (const e of L.edges) {
    if (e.from === nid && String(e.fromPort) === String(pid)) return { node: e.to, port: e.toPort };
    if (e.both && e.to === nid && String(e.toPort) === String(pid)) return { node: e.from, port: e.fromPort };
  }
  return null;
}
const endTip = (nid, pid) => `${esc(nodes[nid]?.name || nid)}${code(nid, nodes[nid])}${pid != null ? ` <span class="muted">${esc(nodes[nid]?.ports.find(p => String(p.id) === String(pid))?.name ?? pid)}</span>` : ''}`;
let svg = '';
L.edges.forEach((e, i) => {
  const ek = D.edgeKinds[e.kind] || {};
  const pts = [portPt(e.from, e.fromPort), ...e.pts, portPt(e.to, e.toPort)];
  const d = 'M' + pts.map(p => p[0].toFixed(0) + ',' + p[1].toFixed(0)).join(' L');
  const color = ek.color && ek.color !== 'auto' ? ek.color : hue(i);
  const dash = ek.dash ? 'class="dotted"' : e.both ? '' : 'class="oneway"';
  const tip = `${ek.label ? esc(ek.label) + ': ' : ''}${endTip(e.from, e.fromPort)} ${e.both ? '↔' : '→'} ${endTip(e.to, e.toPort)}` +
    (e.label ? `<br><span class="muted">${esc(e.label)}</span>` : '') + (e.both ? '' : ` <span class="muted">( ${esc(UI.oneWay)} )</span>`);
  svg += `<path d="${d}" style="stroke:${color}" ${dash} data-a="${esc(e.from)}" data-b="${esc(e.to)}" data-ek="${esc(e.kind || '')}"/><path class="hit" d="${d}" data-tip="${esc(tip)}"/>`;
});
links.innerHTML = svg;

// ---------- toggles ----------
const tg = $('#toggles');
const toggle = (key, text, color, apply) => {
  const l = document.createElement('label');
  l.innerHTML = `<input type="checkbox" checked>${color ? `<span class="sw" style="background:${color}"></span>` : ''}${esc(text)}`;
  l.firstChild.onchange = e => apply(e.target.checked);
  tg.appendChild(l);
};
const hideKind = (k, on) => document.querySelectorAll(`[data-kind="${CSS.escape(k)}"]`).forEach(e => e.style.display = on ? '' : 'none');
toggle('links', UI.links, null, on => document.body.classList.toggle('no-links', !on));
for (const [k, v] of Object.entries(D.edgeKinds)) toggle('ek:' + k, v.label || k, v.color !== 'auto' ? v.color : null,
  on => document.querySelectorAll(`#links path[data-ek="${CSS.escape(k)}"]`).forEach(p => { p.style.display = on ? '' : 'none'; p.nextElementSibling.style.display = on ? '' : 'none'; }));
for (const [k, v] of Object.entries(D.kinds)) toggle('k:' + k, v.label || k, v.color, on => hideKind(k, on));
toggle('labels', UI.labels, null, on => document.body.classList.toggle('no-labels', !on));

// ---------- pan and zoom ----------
const view = $('#view');
let z = 0.3, tx = 20, ty = 20;
const apply = () => { world.style.transform = `translate(${tx}px,${ty}px) scale(${z})`; links.style.setProperty('--k', 1 / z); };
function zoomAt(f, cx, cy) { const nz = Math.min(4, Math.max(0.02, z * f)); tx = cx - (cx - tx) * nz / z; ty = cy - (cy - ty) * nz / z; z = nz; apply(); }
view.addEventListener('wheel', e => { e.preventDefault(); const r = view.getBoundingClientRect(); zoomAt(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX - r.left, e.clientY - r.top); }, { passive: false });
let drag = null, moved = false;
view.addEventListener('pointerdown', e => { if (e.target.closest('#zoom')) return; drag = [e.clientX - tx, e.clientY - ty]; moved = false; view.classList.add('drag'); });
addEventListener('pointermove', e => { if (drag) { const nx = e.clientX - drag[0], ny = e.clientY - drag[1]; if (Math.abs(nx - tx) + Math.abs(ny - ty) > 2) moved = true; tx = nx; ty = ny; apply(); } hover(e); });
addEventListener('pointerup', () => { drag = null; view.classList.remove('drag'); });
// a small node is not blown up past 1.5x
function fit(x, y, w, h, pad = 60) { const r = view.getBoundingClientRect(); z = Math.min(1.5, (r.width - pad * 2) / w, (r.height - pad * 2) / h); tx = r.width / 2 - (x + w / 2) * z; ty = r.height / 2 - (y + h / 2) * z; apply(); }
const fitAll = () => fit(0, 0, L.size[0], L.size[1], 20);
$('#zin').onclick = () => { const r = view.getBoundingClientRect(); zoomAt(1.3, r.width / 2, r.height / 2); };
$('#zout').onclick = () => { const r = view.getBoundingClientRect(); zoomAt(1 / 1.3, r.width / 2, r.height / 2); };
$('#fit').onclick = fitAll;
const focusNode = id => { const b = box(id); if (b) fit(b.x, b.y, b.w, b.h); };
function focusPoint(nid, p) { const n = nodes[nid], b = box(nid), [x, y] = local(n, p); const r = view.getBoundingClientRect(); z = Math.max(z, 1); tx = r.width / 2 - (b.x + x) * z; ty = r.height / 2 - (b.y + y) * z; apply(); }

// ---------- hover and click ----------
const hv = $('#hover');
let hovLine = null;
const entTip = id => { const e = ents[id]; if (!e) return esc(id); const k = kindOf(e.kind); return `<b>${esc(e.name)}</b>${code(id, e)} <span class="tag" style="color:${k.color}">${esc(k.label || e.kind)}</span>${e.badge ? ' ' + esc(e.badge) : ''}`; };
function hover(e) {
  const t = e.target.closest?.('[data-entity],[data-port],[data-tip]');
  const line = t?.dataset.tip !== undefined ? t.previousElementSibling : null;
  if (line !== hovLine) { hovLine?.classList.remove('hov'); hovLine = line; line?.classList.add('hov'); }
  if (!t || drag || (t.dataset.entity === '' && t.dataset.port === undefined)) { hv.style.display = 'none'; return; }
  const r = view.getBoundingClientRect();
  if (t.dataset.tip !== undefined) hv.innerHTML = t.dataset.tip;
  else if (t.dataset.port !== undefined) { const to = portTarget(t.dataset.node, t.dataset.port); hv.innerHTML = endTip(t.dataset.node, t.dataset.port) + (to ? ' → ' + endTip(to.node, to.port) : ` · ${esc(UI.noTarget)}`); }
  else hv.innerHTML = entTip(t.dataset.entity);
  hv.style.display = 'block'; hv.style.left = (e.clientX - r.left + 14) + 'px'; hv.style.top = (e.clientY - r.top + 14) + 'px';
}
view.addEventListener('click', e => {
  if (moved) return;
  const t = e.target.closest('[data-entity],[data-port],.title,.node.plain');
  if (!t) return;
  if (t.dataset.port !== undefined) { const to = portTarget(t.dataset.node, t.dataset.port); if (to) go('node', to.node, true); }
  else if (t.dataset.entity) go('entity', t.dataset.entity);
  else go('node', t.dataset.node || t.querySelector('.title')?.dataset.node);
});
document.addEventListener('click', e => { const t = e.target.closest('[data-go]'); if (t) { const [kind, ...rest] = t.dataset.go.split(':'); go(kind, rest.join(':'), true); } });

// ---------- side list and search ----------
const list = $('#list'), q = $('#q');
const nodeRow = id => `<div class="row" data-go="node:${esc(id)}"><span>${esc(nodes[id].name || id)}</span><span class="r">${esc(nodes[id].code ?? id)}</span></div>`;
const entRow = id => { const e = ents[id], k = kindOf(e.kind); return `<div class="row" data-go="entity:${esc(id)}"><span>${esc(e.name)}${code(id, e)}</span><span class="tag" style="color:${k.color}">${esc(k.label || e.kind)}</span></div>`; };
function showList() {
  const s = q.value.trim().toLowerCase();
  if (!s) {
    let h = `<div class="legend"><h3>${esc(UI.legend)}</h3>` + Object.values(D.kinds).map(k => `<div><span class="sw" style="background:${k.color}"></span>${esc(k.label)}</div>`).join('') +
      Object.values(D.edgeKinds).map(k => `<div><span class="sw" style="background:${k.color && k.color !== 'auto' ? k.color : 'var(--dim)'}"></span>${esc(k.label)}</div>`).join('') + '</div>';
    const order = Object.keys(L.nodes);
    for (const g of [...D.groups, { id: undefined, name: D.groups.length ? '—' : UI.nodes }]) {
      const ids = D.nodes.filter(n => n.group === g.id || (g.id === undefined && !D.groups.some(x => x.id === n.group))).map(n => n.id);
      if (ids.length) h += `<h3 style="${g.color ? 'color:' + g.color : ''}">${esc(g.name ?? g.id)}</h3>` + ids.map(nodeRow).join('');
    }
    list.innerHTML = h; return;
  }
  const hit = (...xs) => xs.some(x => x != null && String(x).toLowerCase().includes(s));
  const ns = D.nodes.filter(n => hit(n.name, n.id, n.code, ...Object.values(n.files || {})));
  const es = Object.entries(ents).filter(([id, e]) => hit(e.name, id, e.code, ...Object.values(e.files || {}).flat()));
  let h = '';
  if (ns.length) h += `<h3>${esc(UI.nodes)}</h3>` + ns.slice(0, 60).map(n => nodeRow(n.id)).join('');
  if (es.length) h += `<h3>${esc(UI.entities)}</h3>` + es.slice(0, 200).map(([id]) => entRow(id)).join('');
  list.innerHTML = h || `<p class="muted">${esc(UI.notFound)}</p>`;
}
q.oninput = showList;

// ---------- detail ----------
const info = $('#info');
const link = id => nodes[id] ? `<span class="a" data-go="node:${esc(id)}">${esc(nodes[id].name || id)}</span>${code(id, nodes[id])}`
  : ents[id] ? `<span class="a" data-go="entity:${esc(id)}">${esc(ents[id].name)}</span>${code(id, ents[id])}` : esc(id);
const fieldsHtml = f => f && Object.keys(f).length ? '<div class="stat">' + Object.entries(f).map(([k, v]) => `<b>${esc(k)}</b><span>${esc(v)}</span>`).join('') + '</div>' : '';
const filesHtml = f => {
  const rows = Object.entries(f || {}).filter(([, v]) => v != null && v !== '' && !(Array.isArray(v) && !v.length));
  return rows.length ? `<h3>${esc(UI.files)}</h3><div class="stat files">` + rows.map(([k, v]) => `<b>${esc(k)}</b><span>${esc([].concat(v).join(', '))}</span>`).join('') + '</div>' : '';
};
const sectionsHtml = secs => (secs || []).map(s => `<h3>${esc(s.title)}${s.rows ? ` (${s.rows.filter(r => !r.heading).length})` : ''}</h3>` + (s.text ? `<p>${esc(s.text)}</p>` : '') +
  (s.rows ? '<table>' + s.rows.map(r => r.heading ? `<tr class="grp"><td colspan="2">${esc(r.heading)}</td></tr>` : `<tr><td>${r.ref ? link(r.ref) : esc(r.text)}${r.note ? `<br><span class="muted">${esc(r.note)}</span>` : ''}</td><td class="n">${esc(r.value)}</td></tr>`).join('') + '</table>' : '')).join('');
const refsHtml = id => {
  const rs = backrefs[id]; if (!rs?.length) return '';
  const by = {}; for (const r of rs) (by[r.section] ??= []).push(r);
  return Object.entries(by).map(([sec, a]) => `<h3>${esc(UI.referencedBy)}: ${esc(sec)} (${a.length})</h3><table>` +
    a.map(r => `<tr><td>${link(r.from)}${appears[r.from] ? `<br><span class="muted">${appears[r.from].map(w => link(w.node)).join(', ')}</span>` : ''}</td><td class="n">${esc(r.value)}</td></tr>`).join('') + '</table>').join('');
};
let sel = null, hl = [];
function select(id) {
  if (sel) nodeEl[sel]?.classList.remove('sel');
  sel = id; if (id) nodeEl[id]?.classList.add('sel');
  hl.forEach(e => e.classList.remove('hl')); hl = [];
  links.querySelectorAll('path.on').forEach(p => p.classList.remove('on'));
  links.classList.toggle('picked', !!id);
  if (id) links.querySelectorAll(`path[data-a="${CSS.escape(id)}"],path[data-b="${CSS.escape(id)}"]`).forEach(p => p.classList.add('on'));
}
function showNode(id, focus) {
  const n = nodes[id]; select(id); if (focus) focusNode(id);
  let h = `<h2>${esc(n.name || id)}${code(id, n)}</h2>` + fieldsHtml(n.fields) + filesHtml(n.files);
  const conns = L.edges.filter(e => e.from === id || e.to === id);
  if (conns.length) h += `<h3>${esc(UI.connections)} (${conns.length})</h3><table>` + conns.map(e => {
    const out = e.from === id, other = out ? e.to : e.from, mine = out ? e.fromPort : e.toPort, theirs = out ? e.toPort : e.fromPort;
    const ek = D.edgeKinds[e.kind];
    return `<tr><td>${mine != null ? esc(n.ports.find(p => String(p.id) === String(mine))?.name ?? mine) : ''} ${e.both ? '↔' : out ? '→' : '←'} ${link(other)}${theirs != null ? ` <span class="muted">${esc(nodes[other].ports.find(p => String(p.id) === String(theirs))?.name ?? theirs)}</span>` : ''}</td><td class="n">${esc(ek?.label || '')}</td></tr>`;
  }).join('') + '</table>';
  const byKind = {};
  for (const m of n.markers) if (m.entity && ents[m.entity]) (byKind[m.kind] ??= []).push(m);
  for (const [k, ms] of Object.entries(byKind)) h += `<h3>${esc(kindOf(k).label || k)} (${ms.length})</h3><table>` + ms.map(m => `<tr><td>${link(m.entity)}</td><td class="n">${esc(ents[m.entity].badge || '')} · ${m.points.length} ${esc(UI.points)}</td></tr>`).join('') + '</table>';
  h += sectionsHtml(n.sections) + refsHtml(id);
  info.innerHTML = h;
}
function showEntity(id, focus) {
  const e = ents[id], k = kindOf(e.kind);
  let h = `<h2>${esc(e.name)}${code(id, e)} <span class="tag" style="color:${k.color}">${esc(k.label || e.kind)}</span></h2>` + fieldsHtml(e.fields) + filesHtml(e.files);
  const w = appears[id] || [];
  if (w.length) h += `<h3>${esc(UI.appearsIn)}</h3>` + w.map(x => `<div class="row" data-go="point:${esc(id)}@${esc(x.node)}"><span>${esc(nodes[x.node].name)}${code(x.node, nodes[x.node])}</span><span class="r">${x.n} ${esc(UI.points)}</span></div>`).join('');
  h += sectionsHtml(e.sections) + refsHtml(id);
  info.innerHTML = h;
  hl.forEach(m => m.classList.remove('hl')); hl = markEl[id] || []; hl.forEach(m => m.classList.add('hl'));
  if (focus && w.length && !(sel && w.some(x => x.node === sel))) point(id, w[0].node);
}
function point(eid, nid) {
  const m = nodes[nid].markers.find(m => m.entity === eid); select(nid);
  hl = markEl[eid] || []; hl.forEach(m => m.classList.add('hl'));
  if (m) focusPoint(nid, m.points[0]);
}
function go(kind, id, focus) {
  if (kind === 'node' && nodes[id]) showNode(id, focus);
  else if (kind === 'entity' && ents[id]) showEntity(id, focus);
  else if (kind === 'point') { const [e, n] = id.split('@'); point(e, n); return; }
  else return;
  history.replaceState(null, '', `#${kind}=${encodeURIComponent(id)}`);
}

showList(); fitAll();
const h0 = location.hash.match(/^#(node|entity)=(.+)$/);
if (h0) go(h0[1], decodeURIComponent(h0[2]), true);
else info.innerHTML = `<h2>${esc(D.title || 'Atlas')}</h2>` + (D.description ? `<p>${esc(D.description)}</p>` : '') +
  `<p class="muted">${D.nodes.length} ${esc(UI.nodes)} · ${L.edges.length} ${esc(UI.connections)} · ${Object.keys(ents).length} ${esc(UI.entities)}</p><p>${esc(UI.hint)}</p>` +
  (D.nodes.some(n => n.root) ? `<h3>${esc(UI.start)}</h3>` + D.nodes.filter(n => n.root).map(n => nodeRow(n.id)).join('') : '') + fieldsHtml(D.fields);
</script>
</body>
