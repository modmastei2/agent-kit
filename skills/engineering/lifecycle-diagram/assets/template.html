<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f8; --surface:#ffffff; --surface-2:#eef1f4; --border:#c9d0d8; --border-soft:#e3e7eb; --border-strong:#8a96a3;
  --text:#1b2129; --muted:#5d6773; --faint:#6b7684;
  --hl:#c2410c;
  --ok:#1d7f46; --ok-bg:#e2f2e8; --cancel:#b8342a; --cancel-bg:#fae5e2; --ret:#a86400; --ret-bg:#fcefd8;
  --exc:#6a45bf; --exc-bg:#ece6fa; --back:#6b7684;
  --t-blue:#2b66c9; --t-green:#1d7f46; --t-gray:#8a96a3; --t-amber:#a86400; --t-red:#b8342a; --t-purple:#6a45bf;
  --code-bg:#1b2129; --code-text:#e6eaee; --code-key:#8cc4ff; --code-str:#b5d98a; --code-num:#f2b56b; --code-com:#8d98a5; --code-kw:#e59adf;
  --brand:__ACCENT__; --brand-soft:__ACCENT_SOFT__;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12161b; --surface:#1b2128; --surface-2:#222a32; --border:#36404b; --border-soft:#262e37; --border-strong:#55616d;
    --text:#e6eaee; --muted:#9aa5b1; --faint:#8d98a5;
    --hl:#f28b54;
    --ok:#5cc489; --ok-bg:#1b3326; --cancel:#ef7a6f; --cancel-bg:#3a1f1c; --ret:#efb256; --ret-bg:#3a2d17;
    --exc:#b49aff; --exc-bg:#2b2440; --back:#8d98a5;
    --t-blue:#79a8ff; --t-green:#5cc489; --t-gray:#55616d; --t-amber:#efb256; --t-red:#ef7a6f; --t-purple:#b49aff;
    --code-bg:#0d1014;
    --brand:__ACCENT_DARK__; --brand-soft:__ACCENT_SOFT_DARK__;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12161b; --surface:#1b2128; --surface-2:#222a32; --border:#36404b; --border-soft:#262e37; --border-strong:#55616d;
  --text:#e6eaee; --muted:#9aa5b1; --faint:#8d98a5;
  --hl:#f28b54;
  --ok:#5cc489; --ok-bg:#1b3326; --cancel:#ef7a6f; --cancel-bg:#3a1f1c; --ret:#efb256; --ret-bg:#3a2d17;
  --exc:#b49aff; --exc-bg:#2b2440; --back:#8d98a5;
  --t-blue:#79a8ff; --t-green:#5cc489; --t-gray:#55616d; --t-amber:#efb256; --t-red:#ef7a6f; --t-purple:#b49aff;
  --code-bg:#0d1014;
  --brand:__ACCENT_DARK__; --brand-soft:__ACCENT_SOFT_DARK__;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:"IBM Plex Sans Thai","Leelawadee UI",Tahoma,system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
code,pre,.mono{font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace}
code{font-size:.88em}
a{color:var(--brand)}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--hl);outline-offset:2px}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em}
.wrap{max-width:1400px;margin:0 auto;padding:0 16px}
@media (min-width:720px){.wrap{padding:0 32px}}
/* embed mode (DATA.embed or ?embed=1): the host page supplies the frame, title and theme */
html.embed body{background:transparent}
/* a frame whose color-scheme differs from its host gets an opaque backdrop; keep it see-through */
html.embed{color-scheme:normal !important}
html.embed header.top,html.embed #themeBtn,html.embed .eyebrow{display:none}
html.embed .wrap{max-width:none;padding:0}
html.embed .head{padding-top:0}
html.embed footer{padding-bottom:4px}

/* header: one bar, the same colour as the page */
header.top{border-bottom:1px solid var(--border)}
header.top:has(.bar:empty){display:none}
.bar{display:flex;align-items:center;gap:6px;min-height:48px;flex-wrap:wrap}
.bar .crumb{color:var(--muted);font-size:13px;margin-right:8px}
.bar a{font-size:13px;text-decoration:none;color:var(--muted);padding:12px 10px 10px;border-bottom:3px solid transparent}
.bar a:hover{color:var(--text)}
.bar a.cur{color:var(--text);font-weight:600;border-bottom-color:var(--text)}
.bar .sp{flex:1}
.iconbtn{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:5px 10px;font:inherit;font-size:13px;cursor:pointer}
.iconbtn:hover{color:var(--text);border-color:var(--border-strong)}
.iconbtn.sq{padding:6px}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:24px 0 4px}
.head>div{display:grid;gap:4px;max-width:110ch}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.head h1{margin:0;font-size:clamp(24px,3vw,30px);line-height:1.3;font-weight:700}
.head .lead{margin:0;color:var(--muted);text-wrap:pretty}
.head .lead:empty{display:none}

section.blk{padding:22px 0 4px}
section.blk[hidden]{display:none}
h2{font-size:20px;margin:0 0 12px;line-height:1.3}

/* scenarios */
.outs{display:flex;flex-wrap:wrap;gap:8px}
.out{font:inherit;font-size:14px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:6px 14px 6px 10px;display:inline-flex;align-items:center;gap:8px;text-align:left}
.out:hover{border-color:var(--border-strong)}
.out[aria-pressed="true"]{border-color:var(--hl);box-shadow:0 0 0 1px var(--hl)}
.tone-ok{--tc:var(--ok)} .tone-cancel{--tc:var(--cancel)} .tone-ret{--tc:var(--ret)} .tone-exc{--tc:var(--exc)}
.out .ic{color:var(--tc)}
.steps{margin-top:10px;min-height:36px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px}
.steps .hint{color:var(--muted)}
.step{font-family:"IBM Plex Mono",monospace;font-size:12px;border:1px solid var(--border);background:var(--surface);padding:3px 9px;border-radius:7px;cursor:pointer;color:var(--text)}
.step.cur{background:var(--hl);border-color:var(--hl);color:var(--surface)}
.steps .ar{color:var(--faint);display:inline-flex}
.outdesc{color:var(--muted);font-size:14px;margin-top:4px;max-width:95ch}
.outdesc:empty{display:none}

.grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px}
.diag{padding:10px}
.diag .scroller{overflow-x:auto;-webkit-overflow-scrolling:touch}
.diag svg{display:block;width:100%;min-width:980px;height:auto}
/* legend: one row above the diagram, lines then box frames then effect dots */
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;margin-top:12px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg-line{width:26px;height:0;border-top:2px solid}
.lg-box{width:12px;height:12px;border-radius:4px;border:1.5px solid var(--border);background:var(--surface)}
.lg-box.k-start{border:2px solid var(--brand)}
.lg-box.k-side{border-style:dashed;background:transparent}
.lg-box.k-ok{background:var(--ok-bg);border-color:var(--ok)}
.lg-box.k-cancel{background:var(--cancel-bg);border-color:var(--cancel);border-style:dashed}
.lg-box.k-ret{background:var(--ret-bg);border-color:var(--ret)}
.lg-box.k-exc{background:var(--exc-bg);border-color:var(--exc);border-style:dashed}
.lg-dot{width:9px;height:9px;border-radius:50%}

/* diagram */
.node{cursor:pointer;outline:none}
.node .nb{fill:var(--surface);stroke:var(--border);stroke-width:1.5;transition:stroke .15s,stroke-width .15s,opacity .2s}
.node.k-side .nb{stroke-dasharray:5 4;fill:transparent}
.node.k-ok .nb{fill:var(--ok-bg);stroke:var(--ok)}
.node.k-cancel .nb{fill:var(--cancel-bg);stroke:var(--cancel);stroke-dasharray:5 4}
.node.k-ret .nb{fill:var(--ret-bg);stroke:var(--ret)}
.node.k-exc .nb{fill:var(--exc-bg);stroke:var(--exc);stroke-dasharray:5 4}
.node.k-start .nb{stroke:var(--brand);stroke-width:2}
.node:hover .nb{stroke:var(--text)}
.node:focus-visible .nb{stroke:var(--hl);stroke-width:2.5}
.node .nc{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:12.5px;fill:var(--text);text-anchor:middle}
.node .nl{font-size:11.5px;fill:var(--muted);text-anchor:middle}
.node .dot{stroke:var(--surface);stroke-width:1.5}
.node .tm{font-family:"IBM Plex Mono",monospace;font-size:9.5px;font-weight:600;letter-spacing:.06em;text-anchor:start;fill:var(--muted)}
.k-ok .tm{fill:var(--ok)} .k-cancel .tm{fill:var(--cancel)} .k-ret .tm{fill:var(--ret)} .k-exc .tm{fill:var(--exc)}
.tn-blue{--tn:var(--t-blue)} .tn-green{--tn:var(--t-green)} .tn-gray{--tn:var(--t-gray)} .tn-amber{--tn:var(--t-amber)} .tn-red{--tn:var(--t-red)} .tn-purple{--tn:var(--t-purple)}
.dot[class*="tn-"]{fill:var(--tn)} .lg-dot[class*="tn-"]{background:var(--tn)}
.edge path{fill:none;stroke-width:1.6;transition:opacity .2s,stroke-width .2s}
.e-main path{stroke:var(--muted)} .e-cancel path{stroke:var(--cancel)} .e-ret path{stroke:var(--ret)} .e-exc path{stroke:var(--exc);stroke-dasharray:5 4} .e-back path{stroke:var(--back);stroke-dasharray:2 4}
.edge text{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:500;fill:var(--muted);text-anchor:middle;paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round;transition:opacity .2s}
.edge .lbg{fill:var(--surface)}
.mk-main{fill:var(--muted)} .mk-cancel{fill:var(--cancel)} .mk-ret{fill:var(--ret)} .mk-exc{fill:var(--exc)} .mk-back{fill:var(--back)}
/* focus: a scenario or a clicked status lights its nodes and lines and fades the rest */
svg.dim .node:not(.on) .nb, svg.dim .node:not(.on) text, svg.dim .node:not(.on) .dot{opacity:.3}
svg.dim .node.on .nb{stroke:var(--hl);stroke-width:2.5}
svg.dim .edge:not(.on){opacity:.12}
svg.dim .edge.on path{stroke-width:2.8}
svg.dim .edge.on text{fill:var(--text);font-weight:600}
.node.sel .nb, svg.dim .node.sel .nb{stroke:var(--text);stroke-width:3}
.rowlab{font-family:"IBM Plex Mono",monospace;font-size:10.5px;fill:var(--muted);letter-spacing:.08em;font-weight:500;paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}
.rowline{stroke:var(--border-soft);stroke-dasharray:3 5}

/* detail panel */
.panel{scroll-margin-top:12px}
.pcols{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:8px 28px}
@media (max-width:900px){.pcols{grid-template-columns:1fr}}
.ph{padding:16px 18px 12px;border-bottom:1px solid var(--border-soft)}
.ph .kind{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.ph .raw{font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:600;word-break:break-word;margin:2px 0 0}
.ph .th{color:var(--muted);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.chip{font-size:12px;border-radius:6px;padding:2px 8px;background:var(--surface-2);color:var(--muted)}
.chip b{color:var(--text);font-weight:600}
.chip[class*="tn-"] b{color:var(--tn)}
.pb{padding:12px 18px 18px}
.pb h3{display:flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.04em;color:var(--muted);margin:16px 0 8px;font-weight:600}
.pb h3:first-child{margin-top:0}
.pb h3 .ic{width:15px;height:15px;color:var(--brand)}
.pb h3.warn .ic{color:var(--hl)}
.pb p{margin:0 0 8px}
.trans{display:flex;flex-direction:column;gap:5px}
.tr{display:flex;align-items:baseline;gap:8px;font-size:14px}
.tr button{font-family:"IBM Plex Mono",monospace;font-size:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:6px;padding:1px 7px;cursor:pointer;flex:none}
.tr button:hover{border-color:var(--hl);color:var(--hl)}
.tr .dir{color:var(--faint);flex:none;display:inline-flex;align-self:center}
.tr .why{color:var(--muted)}
ul.gotcha{margin:0;padding-left:18px;font-size:14px}
ul.gotcha li{margin-bottom:6px}
.api{border:1px solid var(--border);border-radius:10px;margin-bottom:8px;background:var(--surface)}
.api>summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.api>summary::-webkit-details-marker{display:none}
.api>summary .t{flex-basis:100%;font-size:14px;font-weight:600}
.api>summary code{font-size:12px;color:var(--muted);word-break:break-all}
.api[open]>summary{border-bottom:1px solid var(--border-soft)}
.api .ab{padding:10px 12px 12px;font-size:14px}
.m{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:5px;background:var(--surface-2);color:var(--muted)}
.m-GET{color:var(--t-blue)} .m-POST{color:var(--t-green)} .m-PUT,.m-PATCH{color:var(--t-amber)} .m-DELETE{color:var(--t-red)} .m-PUSH,.m-EVENT{color:var(--t-purple)}
.tag{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:999px;margin-left:auto}
.t-doc{background:var(--ok-bg);color:var(--ok)}
.t-repo{background:var(--brand-soft);color:var(--brand)}
.t-unv{background:var(--ret-bg);color:var(--ret)}
.t-gen{background:var(--surface-2);color:var(--muted);border:1px dashed var(--border-strong)}
.cb{margin-top:10px;border-radius:8px;overflow:hidden;background:var(--code-bg)}
.cbh{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;font-size:11.5px;color:#9aa5b1;border-bottom:1px solid rgba(255,255,255,.07)}
.cbh button{display:inline-flex;align-items:center;gap:5px;background:none;border:1px solid rgba(255,255,255,.15);color:#cfd5db;border-radius:6px;font:inherit;font-size:11px;padding:1px 8px;cursor:pointer}
.cbh button:hover{color:#fff;border-color:rgba(255,255,255,.35)}
pre{margin:0;padding:10px 12px;overflow:auto;font-size:12px;line-height:1.55;color:var(--code-text);max-height:420px}
.j-k{color:var(--code-key)} .j-s{color:var(--code-str)} .j-n{color:var(--code-num)} .j-c{color:var(--code-com);font-style:italic} .j-b{color:var(--code-kw)}
.empty{color:var(--muted);font-size:14px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.bcard{padding:14px 16px}
.bcard h4{margin:0 0 6px;font-size:15px;display:flex;align-items:center;gap:8px}
.bcard p,.bcard li{font-size:14px;color:var(--muted)}
.bcard ul{padding-left:18px;margin:6px 0}
.bcard p{margin:0 0 6px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--border-soft);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
th{font-size:13px;color:var(--muted);font-weight:600}
td code{font-size:12.5px}
td .rowbtn{font-family:"IBM Plex Mono",monospace;font-size:12.5px;font-weight:600;background:none;border:none;color:var(--brand);cursor:pointer;padding:0;text-align:left}
.eff{font-weight:600;color:var(--tn,var(--muted))}
footer{padding:22px 0 40px;color:var(--muted);font-size:13px;display:grid;gap:6px}
footer:empty{display:none}
footer details summary{cursor:pointer;width:max-content}
footer ul{padding-left:18px;margin:6px 0 0}
@media (prefers-reduced-motion:reduce){.node .nb,.edge path,.edge text{transition:none}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap bar" id="bar"></div>
</header>
<main class="wrap">
  <div class="head">
    <div>
      <span class="eyebrow" id="eyebrow"></span>
      <h1 id="h1"></h1>
      <p class="lead" id="lead"></p>
    </div>
    <button class="iconbtn sq" id="themeBtn" type="button"></button>
  </div>
  <section class="blk">
    <h2 id="outTitle"></h2>
    <div class="outs" id="outs"></div>
    <div class="steps" id="steps"></div>
    <div class="outdesc" id="outdesc"></div>
    <div class="legend" id="legend"></div>
    <div class="grid">
      <div class="card diag">
        <div class="scroller"><svg id="svg" role="img"></svg></div>
      </div>
      <aside class="card panel" id="panel" aria-live="polite"></aside>
    </div>
  </section>
  <section class="blk" id="basicsBlk">
    <h2 id="basicsTitle"></h2>
    <div class="bgrid" id="basics"></div>
  </section>
  <section class="blk" id="mapBlk">
    <h2 id="mapTitle"></h2>
    <div class="card tbl"><table id="map"></table></div>
  </section>
</main>
<footer class="wrap" id="foot"></footer>

  info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
  route:'<circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/>',
  webhook:'<path d="M18 16.98h-5.99c-1.1 0-1.95.94-2.48 1.9A4 4 0 0 1 2 17c.01-.7.2-1.4.57-2"/><path d="m6 17 3.13-5.78c.53-.97.1-2.18-.5-3.1a4 4 0 1 1 6.89-4.06"/><path d="m12 6 3.13 5.73C15.66 12.7 16.9 13 18 13a4 4 0 0 1 0 8"/>',
  'plug-zap':'<path d="M6.3 20.3a2.4 2.4 0 0 0 3.4 0L12 18l-6-6-2.3 2.3a2.4 2.4 0 0 0 0 3.4Z"/><path d="m2 22 3-3"/><path d="M7.5 13.5 10 11"/><path d="M10.5 16.5 13 14"/><path d="m18 3-4 4h6l-4 4"/>'
};
const icon = name => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[name] || ''}</svg>`;
const TONE_ICON = {ok:'circle-check-big', cancel:'circle-x', ret:'undo-2', exc:'octagon-alert'};

/* ---- built-in labels: plain English defaults, override any key through D.ui / D.tags / D.tagDesc ---- */
const UI = Object.assign({
  eyebrow:'Lifecycle', themeBtn:'Switch light / dark',
  outTitle:'Scenarios',
  noPath:'Pick a scenario to trace its path, or click a status to see what connects to it',
  focusNode:'Showing what connects to', play:'Walk through', pause:'Pause', clear:'Clear',
  mappedLabel:'Maps to', effectLabel:'Effect', whoLabel:'Done by',
  meaning:'What it means', transitions:'Comes from / goes to', terminal:'Ends here',
  webhook:'Event you receive', apis:'Calls you make here', noApi:'Nothing to call here. Wait for the other side, then read the result.',
  gotchas:'Watch out', copy:'Copy', copied:'Copied', req:'Request', res:'Response',
  basicsTitle:'Before your first call', mapTitle:'All statuses',
  colRaw:'Status', colMeaning:'Meaning', colLevel:'Lives on', colMapped:'Maps to', colEffect:'Effect',
  tagsTitle:'How sure:', sources:'Sources', end:'END'
}, D.ui || {});
UI.legend = Object.assign({main:'Main path', cancel:'Cancel / failure', ret:'Reversal / return', exc:'Exception', back:'Goes back'}, (D.ui||{}).legend || {});
UI.kinds = Object.assign({start:'Start', main:'In progress', side:'Side state', ok:'Ends · success', cancel:'Ends · cancelled', cancelMid:'Cancelling', ret:'Reversal / return', exc:'Exception'}, (D.ui||{}).kinds || {});
const TAG = Object.assign({doc:'Official docs', repo:'Verified', unv:'Unverified', gen:'General knowledge'}, D.tags || {});
const TAGDESC = Object.assign({doc:'read in official documentation', repo:'proven by working code, tests or a sandbox', unv:'a source says it is unconfirmed', gen:'not checked against a source'}, D.tagDesc || {});
const WHO = D.actors || {};
const EFF = D.effects || null;
const effOf = n => EFF && n.effect ? EFF[n.effect] : null;
// pages with no events or calls at all (a non-API process) drop the API column entirely
const HAS_API = D.nodes.some(n => n.webhook || (n.apis||[]).length);

// `th` is the pre-1.0 name of `short`; keep reading it so older pages still rebuild
D.nodes.forEach(n => { if (n.short == null && n.th != null) n.short = n.th; });
const L = makeLayout(D);
const { byId, box, edgeGeom } = L;
const isEnd = n => n.end ?? (['ok','cancel'].includes(n.kind) && !D.edges.some(e => e.from === n.id && e.kind !== 'back'));
const label = n => n.code || n.raw;

/* theme and embed mode */
const root = document.documentElement;
const params = new URLSearchParams(location.search);
const EMBED = !!D.embed || (params.has('embed') && params.get('embed') !== '0');
root.classList.toggle('embed', EMBED);
const setTheme = t => { if (t === 'light' || t === 'dark') root.dataset.theme = t; else if (t === 'auto') delete root.dataset.theme; };
// a standalone page remembers the reader's choice; an embedded one follows its host page
// (a srcdoc frame shares the host's storage, so it must not read or write the saved choice)
if (!EMBED) { try { setTheme(localStorage.getItem('lcd-theme')); } catch(e){} }
if (params.has('theme')) setTheme(params.get('theme'));
const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;

/* header */
const nav = (D.nav || []).map(l => `<a href="${esc(l.href)}"${l.current ? ' class="cur"' : ''}>${esc(l.label)}</a>`).join('');
$('#bar').innerHTML = `${D.crumb ? `<span class="crumb">${esc(D.crumb)}</span>` : ''}${nav}`;
$('#themeBtn').setAttribute('aria-label', UI.themeBtn); $('#themeBtn').title = UI.themeBtn;
const themeIcon = () => { $('#themeBtn').innerHTML = icon(isDark() ? 'sun' : 'moon'); };
themeIcon();
$('#themeBtn').onclick = () => {
  root.dataset.theme = isDark() ? 'light' : 'dark';
  if (!EMBED) { try { localStorage.setItem('lcd-theme', root.dataset.theme); } catch(e){} }
  themeIcon();
};
if (EMBED && window.parent !== window) {
  // host to page: postMessage({theme:'light'|'dark'|'auto'}); page to host: {type, height} on every resize
  addEventListener('message', ev => { const m = ev.data; if (m && typeof m === 'object' && 'theme' in m) { setTheme(m.theme); themeIcon(); } });
  const postHeight = () => parent.postMessage({type:'lifecycle-diagram:height', height: Math.ceil(document.documentElement.getBoundingClientRect().height)}, '*');
  if (window.ResizeObserver) new ResizeObserver(postHeight).observe(document.documentElement);
  addEventListener('load', postHeight);
}
$('#eyebrow').textContent = D.eyebrow ?? UI.eyebrow;
$('#h1').textContent = D.name;
$('#lead').innerHTML = D.lead || '';
$('#outTitle').textContent = UI.outTitle;
$('#svg').setAttribute('aria-label', D.name);

/* legend: only the line styles, box frames and effects this page uses */
const usedKinds = new Set(D.edges.map(e => e.kind || 'main'));
const usedBoxes = new Set(D.nodes.map(n => n.kind || 'main'));
const lineStyle = {main:'', cancel:'', ret:'', exc:';border-top-style:dashed', back:';border-top-style:dotted'};
const lineColor = {main:'--muted', cancel:'--cancel', ret:'--ret', exc:'--exc', back:'--back'};
$('#legend').innerHTML = ['main','cancel','ret','exc','back'].filter(k => usedKinds.has(k)).map(k => `<span><i class="lg-line" style="border-color:var(${lineColor[k]})${lineStyle[k]}"></i>${esc(UI.legend[k])}</span>`).join('')
  + ['start','main','side','ok','cancel','ret','exc'].filter(k => usedBoxes.has(k)).map(k => `<span><i class="lg-box k-${k}"></i>${esc(UI.kinds[k])}</span>`).join('')
  + (EFF ? Object.values(EFF).map(e => `<span><i class="lg-dot tn-${e.tone||'gray'}"></i>${esc(e.label)}</span>`).join('') : '');

/* svg */
const svg = $('#svg');
svg.setAttribute('viewBox', `0 0 ${L.W} ${L.H}`);
let s = `<defs>${['main','cancel','ret','exc','back'].map(k => `<marker id="ar-${k}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-${k}" d="M0,0 L10,5 L0,10 z"/></marker>`).join('')}</defs>`;
(D.rows||[]).forEach((r,i) => { if (i>0){ const y = L.TOP + i*L.RH - 18; s += `<line class="rowline" x1="8" x2="${L.W-8}" y1="${y}" y2="${y}"/>`; } });
D.edges.forEach((e,i) => {
  const g = edgeGeom(e); const kind = e.kind || 'main';
  s += `<g class="edge e-${kind}" data-i="${i}"><path d="${g.d}" marker-end="url(#ar-${kind})"/>${e.label ? `<rect class="lbg" rx="3"/><text x="${g.mx}" y="${g.my+3.5}">${esc(e.label)}</text>` : ''}</g>`;
});
(D.rows||[]).forEach((r,i) => { s += `<text class="rowlab" x="10" y="${L.TOP + i*L.RH - 8}">${esc(r)}</text>`; });
D.nodes.forEach(n => {
  const b = box(n); const kind = n.kind || 'main'; const ef = effOf(n);
  s += `<g class="node k-${kind}" data-id="${esc(n.id)}" tabindex="0" role="button" aria-label="${esc(n.raw)} ${esc(n.short)}">
    <rect class="nb" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="9"/>
    ${isEnd(n) ? `<text class="tm" x="${b.x+8}" y="${b.y+15}">${esc(UI.end)}</text>` : ''}
    ${ef ? `<circle class="dot tn-${ef.tone||'gray'}" cx="${b.x+b.w-11}" cy="${b.y+11}" r="4.5"/>` : ''}
    <text class="nc" x="${b.cx}" y="${b.y+27}">${esc(label(n))}</text>
    <text class="nl" x="${b.cx}" y="${b.y+44}">${esc(n.short)}</text></g>`;
});
svg.innerHTML = s;
// a solid backing sized to each rendered label, so the line never shows through its spaces
function fitLabels(){
  svg.querySelectorAll('.edge').forEach(g => {
    const t = g.querySelector('text'), r = g.querySelector('.lbg'); if (!t) return;
    const b = t.getBBox();
    r.setAttribute('x', b.x - 3); r.setAttribute('y', b.y); r.setAttribute('width', b.width + 6); r.setAttribute('height', b.height);
  });
}
fitLabels();
if (document.fonts) document.fonts.ready.then(fitLabels);

/* ---- focus: one scenario, or one status with everything wired to it ---- */
let focus = null;   // {outcome} | {node}
let playTimer = null;
function stopPlay(){ clearInterval(playTimer); playTimer = null; const p = $('#playBtn'); if (p) p.innerHTML = icon('play') + esc(UI.play); }
const nodeEl = id => svg.querySelector(`.node[data-id="${CSS.escape(id)}"]`);
function paint(){
  svg.querySelectorAll('.node,.edge').forEach(el => el.classList.remove('on'));
  svg.classList.toggle('dim', !!focus);
  document.querySelectorAll('.out').forEach(b => b.setAttribute('aria-pressed', String(!!focus?.outcome && b.dataset.id === focus.outcome.id)));
  const lit = (id, edgeIdx) => { nodeEl(id)?.classList.add('on'); if (edgeIdx != null) svg.querySelector(`.edge[data-i="${edgeIdx}"]`).classList.add('on'); };
  if (focus?.outcome){
    const p = focus.outcome.path;
    p.forEach(id => lit(id));
    for (let i=0; i<p.length-1; i++) D.edges.forEach((e,j) => { if (e.from===p[i] && e.to===p[i+1]) lit(e.to, j); });
  } else if (focus?.node){
    lit(focus.node);
    D.edges.forEach((e,j) => { if (e.from===focus.node) lit(e.to, j); else if (e.to===focus.node) lit(e.from, j); });
  }
  renderSteps();
}
function renderSteps(){
  const st = $('#steps');
  if (focus?.outcome){
    const o = focus.outcome;
    st.innerHTML = `<button class="iconbtn" id="playBtn" type="button">${icon('play')}${esc(UI.play)}</button><button class="iconbtn" id="clrBtn" type="button">${icon('x')}${esc(UI.clear)}</button>` +
      o.path.map((id,i) => `${i?`<span class="ar">${icon('arrow-right')}</span>`:''}<button type="button" class="step" data-id="${esc(id)}">${esc(label(byId[id]))}</button>`).join('');
    $('#outdesc').innerHTML = o.desc || '';
    st.querySelectorAll('.step').forEach(b => b.onclick = () => { stopPlay(); select(b.dataset.id, true); });
    $('#playBtn').onclick = () => {
      if (playTimer) return stopPlay();
      let i = 0; select(o.path[0]); $('#playBtn').innerHTML = icon('pause') + esc(UI.pause);
      playTimer = setInterval(() => { i++; if (i >= o.path.length) return stopPlay(); select(o.path[i]); }, 1400);
    };
  } else if (focus?.node){
    st.innerHTML = `<button class="iconbtn" id="clrBtn" type="button">${icon('x')}${esc(UI.clear)}</button><span class="hint">${esc(UI.focusNode)} <b class="mono">${esc(label(byId[focus.node]))}</b></span>`;
    $('#outdesc').innerHTML = '';
  } else {
    st.innerHTML = `<span class="hint">${esc(UI.noPath)}</span>`;
    $('#outdesc').innerHTML = '';
  }
  const c = $('#clrBtn'); if (c) c.onclick = () => setFocus(null);
  document.querySelectorAll('.step').forEach(b => b.classList.toggle('cur', b.dataset.id === selected));
}
function setFocus(f){ stopPlay(); focus = f; paint(); }
function showOutcome(o){ setFocus(o ? {outcome:o} : null); if (o) select(o.path[o.path.length-1], false); }
// clicking a status lights it and its neighbours; clicking it again, empty canvas or Esc clears
// the page never scrolls on its own: the reader stays on the diagram while the panel updates
function focusNode(id, toggle){
  if (toggle && focus?.node === id) setFocus(null); else setFocus({node:id});
  select(id, true);
}
svg.querySelectorAll('.node').forEach(g => {
  g.addEventListener('click', ev => { ev.stopPropagation(); focusNode(g.dataset.id, true); });
  g.addEventListener('keydown', ev => { if (ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); focusNode(g.dataset.id, true);} });
});
svg.addEventListener('click', () => { if (focus) setFocus(null); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && focus) setFocus(null); });

/* code blocks */
function hl(src){
  return esc(src).replace(/((?<=^|\s)\/\/[^\n]*)|("(?:\\.|[^"\\\n])*")(\s*:)?|\b(true|false|null)\b|((?<![\w\/.\-])-?\d+(?:\.\d+)?\b)/gm,
    (m,c,str,colon,kw,num) => c ? `<span class="j-c">${c}</span>` : str ? (colon ? `<span class="j-k">${str}</span>${colon}` : `<span class="j-s">${str}</span>`) : kw ? `<span class="j-b">${kw}</span>` : `<span class="j-n">${num}</span>`);
}
let codeSeq = 0; const codeStore = {};
const copyLabel = done => icon(done ? 'check' : 'copy') + esc(done ? UI.copied : UI.copy);
function codeBlock(lbl, src){
  const id = 'c' + (++codeSeq); codeStore[id] = src;
  return `<div class="cb"><div class="cbh"><span>${esc(lbl)}</span><button type="button" data-copy="${id}">${copyLabel(false)}</button></div><pre>${hl(src)}</pre></div>`;
}
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-copy]'); if (!b || !navigator.clipboard) return;
  navigator.clipboard.writeText(codeStore[b.dataset.copy]).then(() => { b.innerHTML = copyLabel(true); setTimeout(() => b.innerHTML = copyLabel(false), 1200); }, () => {});
});
const tag = t => t ? `<span class="tag t-${t}">${esc(TAG[t] || t)}</span>` : '';
function apiCard(a, open){
  return `<details class="api"${open?' open':''}><summary><span class="t">${esc(a.title)}</span>${a.method ? `<span class="m m-${esc(a.method)}">${esc(a.method)}</span>` : ''}${a.path ? `<code>${esc(a.path)}</code>` : ''}${tag(a.tag)}</summary>
    <div class="ab">${a.note ? `<p>${a.note}</p>` : ''}${a.req ? codeBlock(a.reqLabel || UI.req, a.req) : ''}${a.res ? codeBlock(a.resLabel || UI.res, a.res) : ''}</div></details>`;
}

/* detail panel */
let selected = null;
function select(id, user){
  const n = byId[id]; if (!n) return;
  selected = id;
  svg.querySelectorAll('.node').forEach(g => g.classList.toggle('sel', g.dataset.id === id));
  document.querySelectorAll('.step').forEach(b => b.classList.toggle('cur', b.dataset.id === id));
  if (user) { try { history.replaceState(null, '', '#' + encodeURIComponent(id)); } catch(e){} }
  const ins = D.edges.filter(e => e.to === id), outs = D.edges.filter(e => e.from === id);
  const tr = (e, dir) => { const o = byId[dir==='in' ? e.from : e.to]; return `<div class="tr"><span class="dir">${icon(dir==='in' ? 'arrow-left' : 'arrow-right')}</span><button type="button" data-go="${esc(o.id)}">${esc(label(o))}</button><span class="why">${esc(e.why || e.label || '')}</span></div>`; };
  const kind = n.kind || 'main'; const ef = effOf(n);
  const kindLabel = kind === 'cancel' && !isEnd(n) ? UI.kinds.cancelMid : UI.kinds[kind];
  $('#panel').innerHTML = `
    <div class="ph">
      <div class="kind">${esc(kindLabel)}${n.level ? ' · ' + esc(n.level) : ''}</div>
      <div class="raw">${esc(n.raw)}</div>
      <div class="th">${esc(n.short)}</div>
      <div class="chips">
        ${n.mapped ? `<span class="chip">${esc(UI.mappedLabel)} <b class="mono">${esc(n.mapped)}</b></span>` : ''}
        ${ef ? `<span class="chip tn-${ef.tone||'gray'}">${esc(UI.effectLabel)} <b>${esc(ef.label)}</b></span>` : ''}
        ${n.who ? `<span class="chip">${esc(UI.whoLabel)} <b>${n.who.map(w => esc(WHO[w] || w)).join(' / ')}</b></span>` : ''}
        ${tag(n.tag)}
      </div>
    </div>
    <div class="pb${HAS_API ? ' pcols' : ''}"><div>
      ${n.desc ? `<h3>${icon('info')}${esc(UI.meaning)}</h3><p>${n.desc}</p>` : ''}
      ${ins.length || outs.length ? `<h3>${icon('route')}${esc(UI.transitions)}</h3><div class="trans">${ins.map(e => tr(e,'in')).join('')}${outs.map(e => tr(e,'out')).join('')}${!outs.length ? `<div class="tr"><span class="dir">${icon('circle-stop')}</span><span class="why">${esc(UI.terminal)}</span></div>` : ''}</div>` : ''}
      ${(n.gotchas||[]).length ? `<h3 class="warn">${icon('triangle-alert')}${esc(UI.gotchas)}</h3><ul class="gotcha">${n.gotchas.map(g => `<li>${g}</li>`).join('')}</ul>` : ''}
    </div>${HAS_API ? `<div>
      ${n.webhook ? `<h3>${icon('webhook')}${esc(UI.webhook)}</h3>${apiCard(n.webhook, true)}` : ''}
      <h3>${icon('plug-zap')}${esc(UI.apis)}</h3>
      ${(n.apis||[]).length ? n.apis.map((a,i) => apiCard(a, i===0 && !n.webhook)).join('') : `<p class="empty">${esc(UI.noApi)}</p>`}
    </div>` : ''}</div>`;
}
$('#panel').addEventListener('click', ev => { const b = ev.target.closest('[data-go]'); if (b) focusNode(b.dataset.go, false); });

/* scenarios */
$('#outs').innerHTML = (D.outcomes||[]).map(o => `<button type="button" class="out tone-${o.tone||'ok'}" data-id="${esc(o.id)}" aria-pressed="false">${icon(TONE_ICON[o.tone||'ok'] || 'route')}${esc(o.label)}</button>`).join('');
$('#outs').querySelectorAll('.out').forEach(b => b.onclick = () => {
  const o = D.outcomes.find(x => x.id === b.dataset.id);
  showOutcome(focus?.outcome?.id === o.id ? null : o);
});
if (!(D.outcomes||[]).length) $('#outTitle').hidden = true;

/* basics */
if ((D.basics||[]).length){
  $('#basicsTitle').textContent = UI.basicsTitle;
  $('#basics').innerHTML = D.basics.map(b => `<div class="card bcard"><h4>${esc(b.title)}${tag(b.tag)}</h4>${b.body||''}${b.code ? codeBlock(b.codeLabel||'', b.code) : ''}</div>`).join('');
} else $('#basicsBlk').hidden = true;

/* status table */
const rows = D.nodes.filter(n => n.map !== false);
if (D.mapTable !== false && rows.length){
  $('#mapTitle').textContent = UI.mapTitle;
  const hasMapped = rows.some(n => n.mapped), hasEff = !!EFF, hasLevel = rows.some(n => n.level);
  $('#map').innerHTML = `<thead><tr><th>${esc(UI.colRaw)}</th><th>${esc(UI.colMeaning)}</th>${hasLevel?`<th>${esc(UI.colLevel)}</th>`:''}${hasMapped?`<th>${esc(UI.colMapped)}</th>`:''}${hasEff?`<th>${esc(UI.colEffect)}</th>`:''}</tr></thead><tbody>` +
    rows.map(n => { const ef = effOf(n); return `<tr><td><button class="rowbtn" type="button" data-go="${esc(n.id)}">${esc(n.raw)}</button></td><td>${esc(n.short)}</td>${hasLevel?`<td>${esc(n.level||'')}</td>`:''}${hasMapped?`<td><code>${esc(n.mapped||'—')}</code></td>`:''}${hasEff?`<td class="eff${ef?' tn-'+(ef.tone||'gray'):''}">${esc(ef?.label||'—')}</td>`:''}</tr>`; }).join('') + '</tbody>';
  $('#map').addEventListener('click', ev => { const b = ev.target.closest('[data-go]'); if (b){ focusNode(b.dataset.go, false); svg.scrollIntoView({behavior:'smooth', block:'center'}); } });
} else $('#mapBlk').hidden = true;

/* footer: only what tells the reader how far to trust the page */
const usedTags = new Set([...D.nodes.map(n => n.tag), ...D.nodes.flatMap(n => [...(n.apis||[]), n.webhook].filter(Boolean).map(a => a.tag)), ...(D.basics||[]).map(b => b.tag)].filter(Boolean));
$('#foot').innerHTML = (usedTags.size ? `<div>${esc(UI.tagsTitle)} ` + [...usedTags].map(t => `${tag(t)} ${esc(TAGDESC[t] || '')}`).join(' · ') + '</div>' : '')
  + ((D.sources||[]).length ? `<details><summary>${esc(UI.sources)} (${D.sources.length})</summary><ul>${D.sources.map(x => `<li>${x}</li>`).join('')}</ul></details>` : '');

paint();
const h = decodeURIComponent(location.hash.slice(1));
select(byId[h] ? h : D.nodes[0].id, false);
})();
</script>
</body>
</html>
